
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order Form</title>
</head>
<body>

    <h1>Customer Food Order Form</h1>

    <form>
        <label for="firstName">First Name:</label>
<input type="text" id="firstName" name="firstName" minlength="2" maxlength="30" required>

       <label for="lastName">Last Name:</label>
<input type="text" id="lastName" name="lastName" minlength="2" maxlength="30" required>
        <br><br>

        <label for="food">Food Preference:</label>
        <select id="food" name="food">
            <option value="chicken">Chicken</option>
            <option value="beef">Beef</option>
            <option value="fish">Fish</option>
        </select>
        <br><br>

        <label for="allergies">Allergy Information:</label>
        <br>
        <textarea id="allergies" name="allergies"
                  rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Submit Order</button>
    </form>

</body>
</html>
